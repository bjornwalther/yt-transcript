[project]
name = "ytfetch-mcp"
version = "1.1.0"
description = "YouTube transcript MCP server for Claude & ChatGPT. Token-efficient, cached, reliable."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Björn Walther" }]
readme = "README.md"
keywords = ["youtube", "transcript", "mcp", "claude", "chatgpt", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "pytubefix>=6.0.0",
    "mcp>=1.0.0,<2",
]

[project.urls]
Repository = "https://github.com/bjornwalther/yt-transcript"
Funding = "https://ko-fi.com/bwalther"

[project.scripts]
ytfetch-mcp = "mcp_server:main"
yt-transcript = "yt_transcript:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["yt_transcript.py", "mcp_server.py"]
