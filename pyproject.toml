[project]
name = "yt-transcript"
version = "1.1.0"
description = "YouTube transcript MCP server for Claude Desktop and ChatGPT. Fetch transcripts as clean, token-efficient markdown for AI context."
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Björn Walther", email = "bjorn.walther@wetail.io" },
]
readme = "README.md"
keywords = ["youtube", "transcript", "mcp", "claude", "chatgpt", "ai", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "pytubefix>=6.0.0",
    "mcp>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/bjornwalther/yt-transcript"
Repository = "https://github.com/bjornwalther/yt-transcript"
Issues = "https://github.com/bjornwalther/yt-transcript/issues"
Funding = "https://ko-fi.com/bwalther"

[project.scripts]
yt-transcript = "yt_transcript:main"
yt-transcript-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["yt_transcript.py", "mcp_server.py"]
