[project]
name = "yt-transcript"
version = "1.1.0"
description = "YouTube transcript fetcher: CLI + MCP server for AI tools"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "pytubefix>=6.0.0",
    "mcp>=1.0.0,<2",
]

[project.scripts]
yt-transcript = "yt_transcript:main"
yt-transcript-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["yt_transcript.py", "mcp_server.py"]
